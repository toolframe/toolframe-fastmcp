[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-fastmcp"
version = "0.3.0"
description = "Standalone FastMCP provider for Toolframe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
    "toolframe-sdk>=0.4,<0.5",
    "fastmcp==4.0.0",
    "cryptography==50.0.2",
    "uvicorn==0.42.0",
]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-fastmcp"
Repository = "https://github.com/toolframe/toolframe-fastmcp"
Documentation = "https://github.com/toolframe/toolframe-fastmcp#readme"
Issues = "https://github.com/toolframe/toolframe-fastmcp/issues"

[project.entry-points."toolframe.plugins"]
fastmcp = "toolframe_fastmcp.plugin:plugin"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
